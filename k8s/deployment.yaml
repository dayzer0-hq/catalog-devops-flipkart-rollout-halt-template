# A working Deployment, as it stands before your changes.
#
# ⚠️ IT HAS NO readinessProbe, WHICH IS THE WHOLE PROBLEM. Without one, Kubernetes counts a pod
# as available the moment the container starts, so rolling out the broken image replaces every
# healthy pod with one that never serves — and the rollout reports success.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels: { app: checkout }
spec:
  replicas: 3
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
    spec:
      containers:
        - name: checkout
          image: checkout:good
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  selector: { app: checkout }
  ports:
    - port: 80
      targetPort: 8080
